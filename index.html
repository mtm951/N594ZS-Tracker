<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d355e">
  <title>N594ZS Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand brand-link" role="button" tabindex="0" aria-label="Go to dashboard" onclick="navTo('dashboard')" onkeydown="activateOnEnter(event,()=>navTo('dashboard'))"><span class="plane-logo">✈</span><span>N594ZS Tracker<small>Kitfox Model 4-1050 • project, parts & maintenance workspace</small></span></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="shell">
  <section class="page active" id="page-dashboard"></section>
  <section class="page" id="page-aircraft"></section>
  <section class="page" id="page-projects"></section>
  <section class="page" id="page-parts"></section>
  <section class="page" id="page-orders"></section>
  <section class="page" id="page-documents"></section>
  <section class="page" id="page-checklists"></section>
  <section class="page" id="page-logbook"></section>
  <section class="page" id="page-settings"></section>
</main>
<div class="footer">N594ZS Tracker v3.1 • local-first • project-management aid only; required aircraft/engine records remain separate</div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="toast-wrap" id="toastWrap"></div>
<input class="file-input" type="file" id="importFile" accept="application/json">
<input class="file-input" type="file" id="photoFile" accept="image/*">
<input class="file-input" type="file" id="entityFile" multiple accept="image/*,.pdf,.txt,.md,.doc,.docx,.xls,.xlsx,.csv,.json">
<script src="app.js"></script>
</body>
</html>

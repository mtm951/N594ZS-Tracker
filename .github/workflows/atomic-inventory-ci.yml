name: Verify Atomic Inventory Expansion

on:
  push:
    branches: ["atomic-*", "linked-*", "multi-*", "blocker-*", "simple-*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax
        shell: bash
        run: |
          set -e
          for file in app-*.js; do
            node --check "$file"
          done
      - name: Existing and new regression tests
        shell: bash
        run: |
          set -e
          for file in tests/*.test.mjs; do
            echo "Running $file"
            node "$file"
          done

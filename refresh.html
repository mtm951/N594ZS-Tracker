<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Refresh N594ZS Tracker</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f6f9;color:#17324c;display:grid;min-height:100vh;place-items:center;padding:24px}
    .card{max-width:560px;background:#fff;border:1px solid #dbe4eb;border-radius:14px;padding:24px;box-shadow:0 8px 30px rgba(23,50,76,.12)}
    h1{margin-top:0}.muted{color:#6e7f8e;line-height:1.5}.status{margin-top:16px;font-weight:700}
  </style>
</head>
<body>
  <div class="card">
    <h1>Updating N594ZS Tracker…</h1>
    <div class="muted">This clears only the tracker’s cached website files and service worker. Your Supabase account, cloud records, receipts and aircraft data are not deleted.</div>
    <div class="status" id="status">Preparing update…</div>
  </div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    status.textContent='Removing old app cache…';
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>r.scope.includes('/N594ZS-Tracker/')).map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('n594zs-')).map(k=>caches.delete(k)));
    }
    status.textContent='Loading the current tracker…';
    location.replace('./?fresh='+Date.now());
  }catch(err){
    status.textContent='Update cleanup hit an error. Reload this page once: '+err.message;
  }
})();
</script>
</body>
</html>
